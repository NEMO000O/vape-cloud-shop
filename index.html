            const container = document.getElementById('brands-menu');

                const btn = document.createElement('button');
                btn.className = `brand-btn ${currentBrand === key ? 'active' : ''}`;

                    renderCatalog();
                };

            container.innerHTML = '';
            
            const flavors = brandFlavors[currentBrand] || [];
            if (flavors.length > 0) {
                container.classList.add('show'); 
                flavors.forEach(flavor => {
                    const btn = document.createElement('button');
                    btn.className = `flavor-btn ${currentFlavor === flavor ? 'active' : ''}`;
                    btn.innerText = flavor;
                    btn.onclick = () => {
                        currentFlavor = flavor;
                        renderFlavorsMenu();
                        renderCatalog();
                    };
                    container.appendChild(btn);
                });
            } else {
                container.classList.remove('show');
            }
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog');
            grid.innerHTML = '';
            
            let filtered = products.filter(p => p.category === currentBrand);
            if (currentFlavor !== "Все вкусы") {
                filtered = filtered.filter(p => p.flavor === currentFlavor);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #8e8e93; padding: 20px 0;">Товаров с таким вкусом сейчас нет</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                const currentQty = cart[p.id] || 0;

                card.innerHTML = `
                    <div class="card-icon">💨</div>
                    <h3 class="card-title">${p.name}</h3>
                    <div style="display:flex; flex-direction:column; justify-content:space-between; margin-top:auto; gap: 8px;">
                        <span class="price">${p.price} ₽</span>
                        <div class="quantity-counter">
                            <button class="count-btn" onclick="updateQty(${p.id}, -1)">-</button>
                            <input type="number" class="count-input" id="input-${p.id}" value="${currentQty}" min="0" onchange="setQtyFromInput(${p.id}, this.value)">
                            <button class="count-btn" onclick="updateQty(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, delta) {
            let val = (cart[id] || 0) + delta;
            if (val < 0) val = 0;
            setQtyInCart(id, val);
        }

        function setQtyFromInput(id, value) {
            let val = parseInt(value) || 0;
            if (val < 0) val = 0;
            setQtyInCart(id, val);
        }

        function setQtyInCart(id, val) {
            if (val === 0) { delete cart[id]; } else { cart[id] = val; }
            const input = document.getElementById(`input-${id}`);
            if (input) input.value = val;
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            let total = 0; let hasItems = false;
            let html = `<div class="cart-section"><h2 class="title" style="font-size:18px; margin-bottom:15px; background:none; -webkit-text-fill-color:inherit; color:inherit;">Ваша корзина</h2>`;

            Object.keys(cart).forEach(id => {
                const p = products.find(prod => prod.id == id);
                if (p && cart[id] > 0) {
                    hasItems = true; const cost = p.price * cart[id]; total += cost;
                    html += `<div class="cart-item">
                        <div><strong>${p.name}</strong><br><span style="color:#8e8e93;">${p.price} ₽ x ${cart[id]}</span></div>
                        <span style="font-weight:700; margin-left:auto; color:#a855f7;">${cost} ₽</span>
                    </div>`;
                }
            });
            html += `<div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:15px; font-size:16px;"><span>Итого:</span><span style="margin-left:auto;">${total} ₽</span></div>`;
            html += `<button class="checkout-btn" onclick="sendOrder()">Оформить заказ</button></div>`;

            container.innerHTML = hasItems ? html : '';
        }
        function sendOrder() {
            let total = 0; let compressedParts = [];
            Object.keys(cart).forEach(id => {
                if (cart[id] > 0) {
                    const p = products.find(prod => prod.id == id);
                    if (p) total += p.price * cart[id];
                    compressedParts.push("i" + id + "q" + cart[id]);
                }
            });

            if (compressedParts.length === 0) return;
            const botUsername = "cloud_vapeseller_bot";
            
            const orderPayload = compressedParts.join("_");
            const startParam = "order_" + orderPayload + "_" + userId;
            const targetUrl = "https://t.me/" + botUsername + "?start=" + startParam;

            const container = document.getElementById('cart-container');
            container.innerHTML = `
                <div class="cart-section" style="text-align: center; background-color: rgba(168, 85, 247, 0.1); border-color: #a855f7; border-radius: 16px; padding: 20px;">
                    <h2 class="title" style="color: #a855f7; font-size: 20px; margin-bottom: 10px; background:none; -webkit-text-fill-color:inherit;">🎉 Заказ сформирован!</h2>
                    <p style="font-size: 14px; margin-bottom: 20px; color: #8e8e93;">Сумма к оплате: <strong style="color:#a855f7;">${total} ₽</strong>.</p>
                    <a href="${targetUrl}" target="_blank" class="checkout-btn" style="background-color: #a855f7; margin-top: 0;">ПОДТВЕРДИТЬ В ЧАТЕ БОТА</a>
                </div>
            `;
            cart = {}; renderCatalog();
        }

        loadData();
    </script>
</body>
</html>
